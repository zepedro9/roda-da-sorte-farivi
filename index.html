<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d2c">
  <meta name="description" content="Roda da Sorte do Farivi">
  <title>Roda da Sorte do Farivi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Roda da Sorte <span>do Farivi</span></h1>
    </header>
    <section class="wheel-card" aria-label="Roda da sorte">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="700" height="700" aria-label="Roda com seis prémios"></canvas>
        <div class="wheel-center" aria-hidden="true"><span>✨</span></div>
      </div>
      <button id="spin-button" class="spin-button" type="button"><span class="button-icon" aria-hidden="true">✦</span><span id="button-label">Girar a roda</span></button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
